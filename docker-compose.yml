# Указываем версию формата файла docker-compose, а не версию Python.
# Она определяет какие возможности YAML доступны (например, поддержка depends_on, healthcheck, profiles и т.д.).
# Версия 3.9 - наиболее стабильная версия схемы Compose.
# Сейчас вообще можно не указывать version, потому что новый Docker Compose (v2) сам подбирает нужный формат.
version: "3.9"

# Описываем сервисы (контейнеры), которые нужны для проекта. Список сервисов = контейнеров (каждый блок под ним = отдельный контейнер).
services:

  # Django-приложение
  web:
#    build: .                          # Собираем образ из Dockerfile в корне проекта. Можно вместо этой строки указать "image: habits_tracker_project" (использовать уже готовый образ, который ранее собрали руками с помощью "docker build -t my-django-app ."). Или можно как тут указать build: . (тогда compose сам вызовет docker build и соберёт образ по твоему Dockerfile).
    image: ${DOCKER_HUB_USERNAME}/habits_tracker:latest
    container_name: habits_tracker_web     # Имя контейнера (для удобства)
    command: sh /habits_tracker_project/entrypoint.sh
#    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"  # Миграция и запуск приложения
    volumes:
      - .:/habits_tracker_project                 # Монтируем локальный проект внутрь контейнера
      - media_data:/habits_tracker_project/media  # Отдельный том для медиафайлов (чтобы они не терялись при пересборке)
      - static_volume:/habits_tracker_project/staticfiles  # Отдельный том для статики - будет нужен, если появится фронт
    ports:
      - "8002:8000"                   # Пробрасываем порт (localhost:8002 → контейнер:8000) / 8001 уже занят другим приложением LMS-system
    env_file:
      - .env.docker                   # Загружаем переменные окружения из .env.docker (.env используется для локального запуска - специально разделил)

    depends_on:
      - db                            # Запускаем только после старта Postgres
      - redis                         # И после Redis
    restart: always                   # Перезапускаем контейнер если упал

  # Nginx
  nginx:
    build:                                                    # Собираем образ для Nginx
      context: ./nginx                                        # Контекст сборки = папка nginx (там Dockerfile + конфиг)
    ports:
      - "8081:80"                                             # Пробрасываем порт 80 (HTTP) наружу (внешний 8081 → внутренний 80) / 8081 уже занят другим приложением LMS-system
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf              # Монтируем наш конфиг внутрь контейнера
      - static_volume:/habits_tracker_project/staticfiles     # Том для статики, чтобы nginx видел собранные файлы - будет нужен, если появится фронт
    depends_on:
      - web                                                   # Запускаем nginx только после Django

  # PostgreSQL база данных
  db:
    image: postgres:16                # Используем готовый официальный образ Postgres
    container_name: habits_tracker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Данные хранятся в отдельном томе
    env_file:
      - .env.docker                   # Подтягиваем переменные окружения из .env.docker (.env используется для локального запуска - специально разделил)
#    environment:                      # Можно дополнительно задать явно (перестраховка)
#      POSTGRES_DB: ${DATABASE_NAME}
#      POSTGRES_USER: ${DATABASE_USER}
#      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5441:5432"                   # Делаем доступным Postgres (внешний 5441 → внутренний 5432) / 5440 уже занят другим приложением LMS-system
    restart: always

  # Redis (для Celery брокера)
  redis:
    image: redis:7                    # Берём официальный Redis
    container_name: habits_tracker_redis
    volumes:
      - redis_data:/data              # Том для хранения данных Redis (иначе всё потеряется при пересборке)
    env_file:
      - .env.docker
    ports:
      - "6391:6379"                   # Открываем порт (внешний 6391 → внутренний 6379) / 6390 уже занят другим приложением LMS-system
    restart: always

  # Celery worker (обрабатывает задачи)
  celery:
#    build: .                          # Использует тот же образ, что и web
    image: ${DOCKER_HUB_USERNAME}/habits_tracker:latest  # Использует тот же образ, что и web
    container_name: habits_tracker_celery
    command: celery -A config worker -l info
    volumes:
      - .:/habits_tracker_project
    env_file:
      - .env.docker                   # Подтягиваем переменные окружения из .env.docker (.env используется для локального запуска - специально разделил)
    depends_on:
      - db
      - redis
    restart: always

  # Celery beat (планировщик периодических задач)
  celery_beat:
#    build: .                          # Использует тот же образ, что и web
    image: ${DOCKER_HUB_USERNAME}/habits_tracker:latest  # Использует тот же образ, что и web
    container_name: habits_tracker_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/habits_tracker_project
    env_file:
      - .env.docker                   # Подтягиваем переменные окружения из .env.docker (.env используется для локального запуска - специально разделил)
    depends_on:
      - db
      - redis
    restart: always

# Определяем именованные тома (для хранения данных вне контейнера)
volumes:
  postgres_data:    # для БД Postgres
  media_data:       # для медиафайлов Django (загруженные пользователями картинки/файлы)
  static_volume:    # для собранных статических файлов (чтобы nginx их видел) - это на будущее для фронта
  redis_data:       # для Redis (заменил redis_volume на redis_data ради единообразия)
